<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Obfuscator Pro</title>
    <style>
        :root { --primary: #B91C1C; --primary-hover: #991B1B; --bg: #F3F4F6; --surface: #FFFFFF; --border: #D1D5DB; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--surface); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { margin-top: 0; color: #111827; text-align: center; }
        p.subtitle { text-align: center; color: #6B7280; font-size: 0.9rem; margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; }
        textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 0.9rem; resize: vertical; background: #F9FAFB; }
        .options { margin: 15px 0; padding: 15px; background: #FEF2F2; border-radius: 6px; border: 1px solid #FECACA; }
        .options label { font-weight: 500; cursor: pointer; color: #991B1B; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        button:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

<div class="container">
    <h2>Obfuscator</h2>
    <p class="subtitle">Enkripsi Hex-Base64 Lapis Ganda + Debugger Trap Pembeku Browser.</p>

    <div>
        <label for="inputCode">Masukkan kode</label>
        <textarea id="inputCode" placeholder="Paste kode Anda di sini..."></textarea>
    </div>

    <div class="options">
        <input type="checkbox" id="antiInspect" checked>
        <label for="antiInspect">Aktifkan Jebakan Debugger Blokir Klik Kanan (Direkomendasikan)</label>
    </div>

    <button onclick="protectCode()">Enkripsi</button>

    <div class="output-section">
        <label for="outputCode">Salin hasilnya gunakan index.html</label>
        <textarea id="outputCode" readonly></textarea>
    </div>
</div>

<script>
    function protectCode() {
        const inputArea = document.getElementById('inputCode');
        const outputArea = document.getElementById('outputCode');
        let rawCode = inputArea.value;

        if (!rawCode.trim()) {
            alert("Kode tidak boleh kosong!");
            return;
        }

        // Script Pertahanan Berlapis (Anti Klik Kanan & Debugger Trap)
        const defenseScript = `
<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    }
    setInterval(function() {
        const _0x1 = new Function('debugger');
        _0x1();
    }, 50);
<\/script>`;

        if (document.getElementById('antiInspect').checked) {
            rawCode = defenseScript + "\n" + rawCode;
        }

        try {
            // Lapis 1: Base64
            const step1 = btoa(unescape(encodeURIComponent(rawCode)));
            // Lapis 2: Reverse String
            const step2 = step1.split('').reverse().join('');
            // Lapis 3: Hexadecimal
            let step3 = '';
            for(let i = 0; i < step2.length; i++) {
                step3 += step2.charCodeAt(i).toString(16).padStart(2, '0');
            }

            // Kode Decoder Mandiri yang Disamarkan (IIFE)
            const finalCode = `<script>
(function(){
    var _0xa="${step3}";
    var _0xb="";
    for(var i=0;i<_0xa.length;i+=2){
        _0xb+=String.fromCharCode(parseInt(_0xa.substr(i,2),16));
    }
    var _0xc=_0xb.split('').reverse().join('');
    document.open();
    document.write(decodeURIComponent(escape(atob(_0xc))));
    document.close();
})();
<\/script>`;

            outputArea.value = finalCode;
            outputArea.select();
        } catch (e) {
            alert("Terjadi kesalahan saat memproses kode.");
        }
    }
</script>

</body>
</html>
