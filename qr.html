<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Cleaner Cloud</title>
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Multi-Engine QR Decoder & Generator -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top right, #1e293b, #090d16);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .glass-card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
      position: relative;
    }

    .upload-box {
      border: 2px dashed rgba(56, 189, 248, 0.45);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.45);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-box:hover, .upload-box.dragover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      transform: translateY(-2px);
    }

    .qr-wrapper {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .qr-wrapper canvas {
      max-width: 210px;
      max-height: 210px;
      width: 100%;
      height: auto;
    }

    .info-pill {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
    }

    .cloud-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
    }

    .history-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .history-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .history-list {
      max-height: 360px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 14px;
      transition: border-color 0.2s ease;
    }

    .history-item:hover {
      border-color: rgba(56, 189, 248, 0.45);
    }
  </style>
</head>
<body>

<div class="glass-card p-4">
  <!-- Tombol Ikon Riwayat -->
  <button type="button" class="history-btn" onclick="toggleHistoryView()" id="historyToggleBtn" title="Riwayat Upload QRIS">
    <i class="bi bi-clock-history fs-5"></i>
    <span id="historyBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info text-dark d-none" style="font-size: 0.65rem;">0</span>
  </button>

  <!-- Header Simpel -->
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-info rounded-circle mb-2" style="width: 52px; height: 52px;">
      <i class="bi bi-qr-code-scan fs-3"></i>
    </div>
    <h5 class="fw-bold mb-1 text-white">QRIS Cleaner</h5>
    <p class="text-secondary small mb-0" id="headerSubtitle">Upload galeri deteksi merchant nominal</p>
  </div>

  <!-- Bagian Utama (Upload & Hasil) -->
  <div id="mainView">
    <!-- Area Upload Galeri -->
    <div id="uploadSection">
      <div class="upload-box p-4 text-center" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <i class="bi bi-images text-info display-5 mb-2 d-block"></i>
        <span class="btn btn-primary btn-sm px-4 rounded-pill fw-semibold">
          <i class="bi bi-upload me-1"></i> Upload Gambar
        </span>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </div>

    <!-- Indikator Proses / Error -->
    <div id="statusBox" class="mt-3 d-none"></div>

    <!-- Hasil Deteksi & QR Bersih -->
    <div id="resultSection" class="d-none text-center">
      <!-- Detail Merchant & Nominal -->
      <div class="info-pill p-3 mb-3 text-start">
        <div class="d-flex align-items-center mb-2 pb-2 border-bottom border-secondary border-opacity-25">
          <div class="bg-info bg-opacity-10 text-info rounded-3 p-2 me-3">
            <i class="bi bi-shop fs-5"></i>
          </div>
          <div class="overflow-hidden">
            <div class="text-secondary" style="font-size: 0.72rem;">NAMA MERCHANT</div>
            <div id="merchantName" class="fw-bold text-white text-truncate">-</div>
          </div>
        </div>

        <div class="d-flex align-items-center">
          <div class="bg-success bg-opacity-10 text-success rounded-3 p-2 me-3">
            <i class="bi bi-cash-coin fs-5"></i>
          </div>
          <div>
            <div class="text-secondary" style="font-size: 0.72rem;">NOMINAL PEMBAYARAN</div>
            <div id="merchantAmount" class="fw-bold text-success fs-6">-</div>
          </div>
        </div>
      </div>

      <!-- Canvas QR Bersih -->
      <div class="qr-wrapper mb-3">
        <canvas id="cleanCanvas"></canvas>
      </div>

      <!-- Box Link Cloudinary -->
      <div class="cloud-box p-3 mb-3 text-start">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="text-info fw-semibold" style="font-size: 0.75rem;">
            <i class="bi bi-cloud-check-fill me-1"></i> Link Preview Cloudinary
          </span>
          <span id="cloudStatusBadge" class="badge bg-secondary" style="font-size: 0.65rem;">Menunggu...</span>
        </div>
        <div class="input-group input-group-sm mt-1">
          <input type="text" id="cloudinaryUrlInput" class="form-control bg-dark text-light border-secondary" readonly placeholder="Mengunggah ke Cloudinary...">
          <button class="btn btn-outline-info" type="button" id="copyLinkBtn" onclick="copyCloudinaryLink()" disabled title="Salin Link">
            <i class="bi bi-clipboard"></i>
          </button>
          <a id="previewLinkBtn" href="#" target="_blank" class="btn btn-info text-dark disabled" title="Buka Preview">
            <i class="bi bi-box-arrow-up-right"></i>
          </a>
        </div>
      </div>

      <!-- Tombol Aksi -->
      <div class="d-grid gap-2">
        <button class="btn btn-success fw-semibold py-2 rounded-3" onclick="downloadCleanQR()">
          <i class="bi bi-download me-1"></i> Download QRIS
        </button>
        <button class="btn btn-outline-secondary btn-sm py-2 rounded-3" onclick="resetApp()">
          <i class="bi bi-arrow-repeat me-1"></i> Upload Gambar Lain
        </button>
      </div>
    </div>
  </div>

  <!-- Bagian Riwayat Upload -->
  <div id="historyView" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="fw-semibold text-white small">
        <i class="bi bi-journal-text text-info me-1"></i> Riwayat
      </span>
      <button type="button" class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size: 0.75rem;" onclick="clearAllHistory()" id="clearHistoryBtn">
        <i class="bi bi-trash3 me-1"></i> Hapus Semua
      </button>
    </div>

    <div id="historyListContainer" class="history-list d-flex flex-column gap-2 mb-3"></div>

    <div class="d-grid">
      <button type="button" class="btn btn-outline-info btn-sm py-2 rounded-3" onclick="toggleHistoryView(false)">
        <i class="bi bi-arrow-left me-1"></i> Kembali ke Upload
      </button>
    </div>
  </div>
</div>

<script>
  // ========================================================
  // KONFIGURASI CLOUDINARY
  // ========================================================
  const CLOUDINARY_CLOUD_NAME = 'davgb7tjm';
  const CLOUDINARY_UPLOAD_PRESET = 'fast9929';
  const HISTORY_STORAGE_KEY = 'qris_cleaner_history_v1';

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const statusBox = document.getElementById('statusBox');
  const uploadSection = document.getElementById('uploadSection');
  const resultSection = document.getElementById('resultSection');
  const cleanCanvas = document.getElementById('cleanCanvas');
  const merchantNameEl = document.getElementById('merchantName');
  const merchantAmountEl = document.getElementById('merchantAmount');

  const cloudinaryUrlInput = document.getElementById('cloudinaryUrlInput');
  const cloudStatusBadge = document.getElementById('cloudStatusBadge');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const previewLinkBtn = document.getElementById('previewLinkBtn');

  const mainView = document.getElementById('mainView');
  const historyView = document.getElementById('historyView');
  const historyListContainer = document.getElementById('historyListContainer');
  const historyBadge = document.getElementById('historyBadge');
  const historyToggleBtn = document.getElementById('historyToggleBtn');
  const headerSubtitle = document.getElementById('headerSubtitle');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  let currentMerchant = 'QRIS';
  let currentHistoryId = null;

  // Inisialisasi badge riwayat saat halaman dibuka
  updateHistoryBadge();

  fileInput.addEventListener('change', (e) => {
    if (e.target.files?.[0]) processImageFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files?.[0]) processImageFile(e.dataTransfer.files[0]);
  });

  function showLoading(msg) {
    statusBox.className = 'alert alert-info d-flex align-items-center gap-2 py-2 px-3 small mt-3 mb-0 rounded-3';
    statusBox.innerHTML = `<div class="spinner-border spinner-border-sm"></div><span>${msg}</span>`;
  }

  function showError(msg) {
    statusBox.className = 'alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small mt-3 mb-0 rounded-3';
    statusBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i><span>${msg}</span>`;
  }

  function hideStatus() {
    statusBox.className = 'd-none';
    statusBox.innerHTML = '';
  }

  // Manajemen Riwayat (LocalStorage)
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
    updateHistoryBadge();
  }

  function updateHistoryBadge() {
    const list = getHistory();
    if (list.length > 0) {
      historyBadge.textContent = list.length;
      historyBadge.classList.remove('d-none');
    } else {
      historyBadge.classList.add('d-none');
    }
  }

  function formatDateTimeWIB(dateObj) {
    const tanggal = dateObj.toLocaleDateString('id-ID', {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    });
    const jam = dateObj.toLocaleTimeString('id-ID', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    }).replace(/\./g, ':');
    return { tanggal, jam };
  }

  function addHistoryRecord(merchant, amount) {
    const now = new Date();
    const { tanggal, jam } = formatDateTimeWIB(now);
    const id = Date.now();
    const list = getHistory();

    list.unshift({
      id,
      merchant,
      amount,
      tanggal,
      jam,
      cloudUrl: ''
    });

    // Batasi maksimal 50 riwayat terakhir agar ringan
    if (list.length > 50) list.pop();
    saveHistory(list);
    return id;
  }

  function updateHistoryCloudUrl(id, url) {
    if (!id) return;
    const list = getHistory();
    const item = list.find((entry) => entry.id === id);
    if (item) {
      item.cloudUrl = url;
      saveHistory(list);
    }
  }

  function deleteHistoryItem(id) {
    const list = getHistory().filter((item) => item.id !== id);
    saveHistory(list);
    renderHistoryList();
  }

  function clearAllHistory() {
    localStorage.removeItem(HISTORY_STORAGE_KEY);
    updateHistoryBadge();
    renderHistoryList();
  }

  function toggleHistoryView(forceState) {
    const showHistory = typeof forceState === 'boolean'
      ? forceState
      : historyView.classList.contains('d-none');

    if (showHistory) {
      mainView.classList.add('d-none');
      historyView.classList.remove('d-none');
      historyToggleBtn.innerHTML = '<i class="bi bi-x-lg fs-6"></i>';
      headerSubtitle.textContent = 'Daftar riwayat pemindaian QRIS';
      renderHistoryList();
    } else {
      historyView.classList.add('d-none');
      mainView.classList.remove('d-none');
      historyToggleBtn.innerHTML = `
        <i class="bi bi-clock-history fs-5"></i>
        <span id="historyBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info text-dark ${getHistory().length ? '' : 'd-none'}" style="font-size: 0.65rem;">${getHistory().length}</span>
      `;
      headerSubtitle.textContent = 'Upload galeri deteksi merchant nominal';
    }
  }

  function renderHistoryList() {
    const list = getHistory();
    clearHistoryBtn.classList.toggle('d-none', list.length === 0);

    if (list.length === 0) {
      historyListContainer.innerHTML = `
        <div class="text-center py-4 text-secondary small">
          <i class="bi bi-inbox fs-2 d-block mb-2 opacity-50"></i>
          Belum ada riwayat 
        </div>
      `;
      return;
    }

    historyListContainer.innerHTML = list.map((item) => `
      <div class="history-item p-3 text-start">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
          <div class="fw-bold text-white text-truncate" style="font-size: 0.88rem;">
            <i class="bi bi-shop text-info me-1"></i> ${escapeHtml(item.merchant)}
          </div>
          <button type="button" class="btn btn-link text-secondary p-0" onclick="deleteHistoryItem(${item.id})" title="Hapus item">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>

        <div class="fw-semibold text-success mb-2" style="font-size: 0.85rem;">
          <i class="bi bi-cash-coin me-1"></i> ${escapeHtml(item.amount)}
        </div>

        <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25">
          <small class="text-secondary" style="font-size: 0.72rem;">
            <i class="bi bi-calendar3 me-1"></i>${escapeHtml(item.tanggal)} &bull; <i class="bi bi-clock me-1"></i>${escapeHtml(item.jam)}
          </small>
          ${item.cloudUrl ? `
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-outline-info btn-sm py-0 px-2" style="font-size: 0.7rem;" onclick="copyHistoryUrl('${item.cloudUrl}', this)" title="Salin Link">
                <i class="bi bi-clipboard"></i> Salin
              </button>
              <a href="${item.cloudUrl}" target="_blank" class="btn btn-info text-dark btn-sm py-0 px-2" style="font-size: 0.7rem;" title="Lihat QR">
                <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </div>
          ` : `<span class="badge bg-secondary" style="font-size: 0.65rem;">Tanpa Link</span>`}
        </div>
      </div>
    `).join('');
  }

  function copyHistoryUrl(url, btnEl) {
    navigator.clipboard.writeText(url).then(() => {
      const original = btnEl.innerHTML;
      btnEl.innerHTML = '<i class="bi bi-check2"></i> Tersalin';
      setTimeout(() => {
        btnEl.innerHTML = original;
      }, 1500);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function detectWhiteQrBox(img) {
    const scanCanvas = document.createElement('canvas');
    const maxDim = 800;
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    scanCanvas.width = Math.round(img.width * scale);
    scanCanvas.height = Math.round(img.height * scale);
    const ctx = scanCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);

    const { width, height } = scanCanvas;
    const data = ctx.getImageData(0, 0, width, height).data;

    let minX = width, minY = height, maxX = 0, maxY = 0, whiteCount = 0;
    const marginX = Math.floor(width * 0.1);
    const marginY = Math.floor(height * 0.12);

    for (let y = marginY; y < height - marginY; y++) {
      for (let x = marginX; x < width - marginX; x++) {
        const idx = (y * width + x) * 4;
        if (data[idx] > 225 && data[idx + 1] > 225 && data[idx + 2] > 225) {
          whiteCount++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    const boxW = maxX - minX;
    const boxH = maxY - minY;

    if (whiteCount > 2000 && boxW > 80 && boxH > 80 && Math.abs(boxW - boxH) < boxW * 0.35) {
      const pad = Math.round(Math.max(boxW, boxH) * 0.06);
      const sx = Math.max(0, Math.round((minX - pad) / scale));
      const sy = Math.max(0, Math.round((minY - pad) / scale));
      const sw = Math.min(img.width - sx, Math.round((boxW + pad * 2) / scale));
      const sh = Math.min(img.height - sy, Math.round((boxH + pad * 2) / scale));

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = sw;
      cropCanvas.height = sh;
      cropCanvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      return cropCanvas;
    }

    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = img.width;
    fullCanvas.height = img.height;
    fullCanvas.getContext('2d').drawImage(img, 0, 0);
    return fullCanvas;
  }

  function createThresholdCanvas(sourceCanvas, threshold, clearCenterRatio = 0) {
    const size = 500;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(sourceCanvas, 0, 0, size, size);

    const imgData = ctx.getImageData(0, 0, size, size);
    const d = imgData.data;

    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const val = lum < threshold ? 0 : 255;
      d[i] = d[i + 1] = d[i + 2] = val;
      d[i + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);

    if (clearCenterRatio > 0) {
      const hole = size * clearCenterRatio;
      const offset = (size - hole) / 2;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(offset, offset, hole, hole);
    }
    return c;
  }

  async function decodeCanvas(canvas) {
    if ('BarcodeDetector' in window) {
      try {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        const codes = await detector.detect(canvas);
        if (codes.length > 0 && codes[0].rawValue) return codes[0].rawValue;
      } catch (e) {}
    }

    try {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) return code.data;
    } catch (e) {}

    try {
      const reader = new ZXing.BrowserQRCodeReader();
      const imgEl = new Image();
      imgEl.src = canvas.toDataURL('image/png');
      await new Promise((res) => (imgEl.onload = res));
      const result = await reader.decodeFromImageElement(imgEl);
      if (result && result.text) return result.text;
    } catch (e) {}

    return null;
  }

  function parseEMVCoQRIS(payload) {
    let i = 0;
    let merchant = 'Merchant QRIS';
    let amount = 'Input Manual Dinamis';

    while (i + 4 <= payload.length) {
      const tag = payload.substring(i, i + 2);
      const len = parseInt(payload.substring(i + 2, i + 4), 10);
      if (isNaN(len) || i + 4 + len > payload.length) break;

      const value = payload.substring(i + 4, i + 4 + len);
      if (tag === '59') {
        merchant = value.trim();
      } else if (tag === '54') {
        const num = parseFloat(value);
        if (!isNaN(num) && num > 0) {
          amount = 'Rp ' + num.toLocaleString('id-ID');
        }
      }
      i += 4 + len;
    }
    return { merchant, amount };
  }

  async function uploadCanvasToCloudinary(canvas, historyId) {
    cloudinaryUrlInput.value = '';
    copyLinkBtn.disabled = true;
    previewLinkBtn.classList.add('disabled');
    previewLinkBtn.href = '#';

    cloudStatusBadge.className = 'badge bg-info text-dark';
    cloudStatusBadge.textContent = 'Mengunggah...';
    cloudinaryUrlInput.placeholder = 'Mengunggah ke server Cloudinary...';

    try {
      const dataUrl = canvas.toDataURL('image/png');
      const formData = new FormData();
      formData.append('file', dataUrl);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('public_id', `qris_${currentMerchant}_${Date.now()}`);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (response.ok && result.secure_url) {
        cloudStatusBadge.className = 'badge bg-success';
        cloudStatusBadge.textContent = 'Tersimpan';
        cloudinaryUrlInput.value = result.secure_url;
        copyLinkBtn.disabled = false;
        previewLinkBtn.href = result.secure_url;
        previewLinkBtn.classList.remove('disabled');

        updateHistoryCloudUrl(historyId, result.secure_url);
      } else {
        throw new Error(result.error?.message || 'Gagal upload ke Cloudinary');
      }
    } catch (err) {
      cloudStatusBadge.className = 'badge bg-danger';
      cloudStatusBadge.textContent = 'Gagal';
      cloudinaryUrlInput.placeholder = err.message;
    }
  }

  async function processImageFile(file) {
    showLoading('Memindai kode QRIS...');

    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise((res) => (img.onload = res));
    await new Promise((r) => setTimeout(r, 30));

    const croppedCanvas = detectWhiteQrBox(img);
    const variants = [
      croppedCanvas,
      createThresholdCanvas(croppedCanvas, 128, 0),
      createThresholdCanvas(croppedCanvas, 100, 0),
      createThresholdCanvas(croppedCanvas, 160, 0),
      createThresholdCanvas(croppedCanvas, 128, 0.22),
      createThresholdCanvas(croppedCanvas, 110, 0.25)
    ];

    let payload = null;
    for (const variant of variants) {
      payload = await decodeCanvas(variant);
      if (payload) break;
      await new Promise((r) => setTimeout(r, 10));
    }

    if (!payload) {
      showError('QRIS tidak terbaca pastikan gambar jelas.');
      return;
    }

    const info = parseEMVCoQRIS(payload);
    currentMerchant = info.merchant.replace(/[^a-zA-Z0-9]/g, '_');
    merchantNameEl.textContent = info.merchant;
    merchantAmountEl.textContent = info.amount;

    // Simpan otomatis ke riwayat
    currentHistoryId = addHistoryRecord(info.merchant, info.amount);

    QRCode.toCanvas(cleanCanvas, payload, {
      width: 600,
      margin: 2,
      errorCorrectionLevel: 'H',
      color: { dark: '#000000', light: '#ffffff' }
    }, (err) => {
      if (err) {
        showError('Gagal membuat gambar QRIS.');
        return;
      }
      hideStatus();
      uploadSection.classList.add('d-none');
      resultSection.classList.remove('d-none');

      uploadCanvasToCloudinary(cleanCanvas, currentHistoryId);
    });
  }

  function copyCloudinaryLink() {
    const url = cloudinaryUrlInput.value;
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
      copyLinkBtn.innerHTML = '<i class="bi bi-check-lg text-success"></i>';
      setTimeout(() => {
        copyLinkBtn.innerHTML = '<i class="bi bi-clipboard"></i>';
      }, 2000);
    });
  }

  function downloadCleanQR() {
    const link = document.createElement('a');
    link.download = `QRIS_${currentMerchant}.png`;
    link.href = cleanCanvas.toDataURL('image/png');
    link.click();
  }

  function resetApp() {
    fileInput.value = '';
    resultSection.classList.add('d-none');
    uploadSection.classList.remove('d-none');
    hideStatus();
  }
</script>

</body>
</html>
