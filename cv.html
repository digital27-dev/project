<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Image Previewer</title>
    
    <!-- Mengimpor Bootstrap Icons via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-body: #09090b;       /* Zinc 950 */
            --bg-card: #18181b;       /* Zinc 900 */
            --bg-input: #27272a;      /* Zinc 800 */
            --text-main: #f4f4f5;     /* Zinc 50 */
            --text-muted: #a1a1aa;    /* Zinc 400 */
            --border-color: #3f3f46;  /* Zinc 700 */
            --primary: #6366f1;       /* Indigo 500 */
            --primary-hover: #4f46e5; /* Indigo 600 */
            --danger: #ef4444;        /* Red 500 */
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.1), transparent 40%),
                radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.05), transparent 40%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #818cf8, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 20px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s ease;
            
            /* INI KUNCINYA: Menghilangkan garis/fitur tarik (resize) di pojok kanan bawah */
            resize: none; 
        }

        textarea::placeholder {
            color: #52525b;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #27272a;
        }

        /* Kustomisasi Scrollbar agar elegan */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #52525b; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #71717a; }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .error {
            background-color: var(--danger-bg);
            color: var(--danger);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: slideDown 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Area Preview */
        #previewContainer {
            margin-top: 30px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border: 1px dashed var(--border-color);
            display: none;
            animation: slideDown 0.4s ease;
            text-align: center;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2><i class="bi bi-image-fill" style="color: #818cf8;"></i> Base64 Previewer</h2>
            <p>Tempel kode Base64 Anda untuk melihat pratinjau gambar.</p>
        </div>
        
        <div class="input-group">
            <textarea id="base64Input" placeholder="Tempel kode Base64 di sini..."></textarea>
        </div>
        
        <div id="errorMsg" class="error" style="display: none;">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorText">Teks Base64 tidak valid atau kosong!</span>
        </div>
        
        <div class="btn-group">
            <button id="clearBtn" class="btn-secondary">
                <i class="bi bi-trash3"></i> Bersihkan
            </button>
            <button id="previewBtn" class="btn-primary">
                <i class="bi bi-eye"></i> Pratinjau
            </button>
        </div>

        <div id="previewContainer">
            <img id="preview" alt="Preview Gambar">
        </div>
    </div>

    <script>
        const base64Input = document.getElementById('base64Input');
        const previewBtn = document.getElementById('previewBtn');
        const clearBtn = document.getElementById('clearBtn');
        const previewContainer = document.getElementById('previewContainer');
        const preview = document.getElementById('preview');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        // Fungsi Tampilkan Preview
        previewBtn.addEventListener('click', function() {
            let base64String = base64Input.value.trim();
            
            // Sembunyikan error sebelumnya
            errorMsg.style.display = 'none';

            if (!base64String) {
                errorText.textContent = "Silakan masukkan kode Base64 terlebih dahulu.";
                errorMsg.style.display = 'flex';
                previewContainer.style.display = 'none';
                
                // Efek getar (shake) pada input box
                base64Input.style.transform = 'translateX(5px)';
                setTimeout(() => base64Input.style.transform = 'translateX(-5px)', 100);
                setTimeout(() => base64Input.style.transform = 'translateX(0)', 200);
                return;
            }

            // Tambahkan prefix jika user hanya menempelkan kode mentah
            if (!base64String.startsWith('data:image')) {
                let mimeType = base64String.startsWith('/9j/') ? 'jpeg' : 'png';
                base64String = `data:image/${mimeType};base64,` + base64String;
            }

            // Set gambar
            preview.src = base64String;
            previewContainer.style.display = 'block';
            
            // Tangani error jika bukan gambar
            preview.onerror = function() {
                errorText.textContent = "Kode Base64 rusak atau format tidak didukung.";
                errorMsg.style.display = 'flex';
                previewContainer.style.display = 'none';
            };
        });

        // Fungsi Bersihkan
        clearBtn.addEventListener('click', function() {
            base64Input.value = '';
            errorMsg.style.display = 'none';
            previewContainer.style.display = 'none';
            preview.src = '';
            base64Input.focus();
        });
    </script>
</body>
</html>
